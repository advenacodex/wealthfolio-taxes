services:
  wealthfolio-taxes:
    container_name: wealthfolio-taxes
    image: wealthfolio-taxes:latest
    ports:
      - "3001:3000"
    user: "1000:10"
    volumes:
      # Mount the Wealthfolio data directory (Read/Write — SQLite WAL mode needs
      # write access to .db-shm/.db-wal even when the app opens the file read-only).
      #
      # macOS (default):
      - "${HOME}/Library/Application Support/wealthfolio:/app/db"
      # Linux — uncomment and adjust if running on a Linux host:
      # - "${HOME}/.local/share/wealthfolio:/app/db"
      # Custom path — use this if your database lives elsewhere:
      # - "/absolute/path/to/wealthfolio-dir:/app/db"
    environment:
      # Path to the database file inside the mounted directory
      - WF_DB_PATH=/app/db/wealthfolio.db
      # Login credentials — CHANGE THESE before exposing the app on a network
      - APP_USERNAME=admin
      - APP_PASSWORD=cambia-esta-contraseña
      # Random secret for signing the session cookie — CHANGE THIS too
      - AUTH_SECRET=cambia-este-secreto-por-uno-aleatorio
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    driver: bridge
